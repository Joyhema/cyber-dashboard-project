<!DOCTYPE html>
<html>
<head>
    <title>Add Cybersecurity Complaint</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .container {
            width: 70%;
            max-width: 700px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            color: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚨 Report Cybersecurity Complaint</h1>

    <div class="form-box">

        <form method="POST">

            <label>Complaint Title</label>
            <input
                type="text"
                name="title"
                placeholder="Enter complaint title"
                required
            >

            <label>Description</label>
            <textarea
                name="description"
                placeholder="Describe the cybersecurity issue"
                required
            ></textarea>

            <label>Complaint Type</label>
            <select name="complaint_type" required>
                <option value="Phishing">Phishing</option>
                <option value="Fake Website">Fake Website</option>
                <option value="Suspicious Login">Suspicious Login</option>
                <option value="Other">Other</option>
            </select>

            <label>Severity</label>
            <select name="severity" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">
                🚀 Submit Complaint
            </button>

        </form>

        <a class="back" href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
